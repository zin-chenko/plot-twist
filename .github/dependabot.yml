version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    groups:
      spring-patches:
        patterns: ["org.springframework.*"]
        update-types: [patch]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker/nginx
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /docker/garage
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
