name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3, pinned
      - name: Validate OpenAPI
        run: |
          python3 -O embeddings-service/test_integrity.py
          python3 embeddings-service/test_download.py
          python3 -m venv /tmp/spec
          /tmp/spec/bin/pip install openapi-spec-validator==0.7.2
          /tmp/spec/bin/python -c 'import json; from openapi_spec_validator import validate_spec; validate_spec(json.load(open("docs/openapi.json")))'
      - name: Build images and execute Java security/unit tests
        run: docker compose build
      - name: Reject invalid ONNX artifacts with real runtime
        run: docker compose run --rm --no-deps --entrypoint python -T embeddings - < embeddings-service/test_runtime.py
      - name: Validate production composition
        run: |
          docker compose --env-file .env.production.example -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose --profile monitoring --env-file .env.production.example -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Start isolated development stack
        run: docker compose up -d --no-build --wait --wait-timeout 600
      - name: Exercise registration and private profile API
        run: |
          python3 scripts/smoke-test.py
          python3 scripts/test-auth.py --restart
          python3 scripts/test-profile.py
          python3 scripts/test-stories.py
          python3 scripts/test-recommendations.py --semantic
          docker compose exec -T embeddings python - < embeddings-service/test_model.py
          docker compose run --rm --no-deps --entrypoint python -T embeddings - < scripts/test-vector-protocol.py
          python3 scripts/test-backup-restore.py
      - name: Verify provisioned monitoring and real HTTP histograms
        run: python3 scripts/test-monitoring.py
      - name: Exercise backend failover
        run: python3 scripts/test-resilience.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100
      - name: Stop CI-owned containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
  moderation-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify RabbitMQ moderation without recommendation model or frontend
        run: docker compose -p plot-twist-moderation-test -f compose.moderation-test.yaml run --rm --build domain-tests
      - name: Diagnostics
        if: failure()
        run: docker compose -p plot-twist-moderation-test -f compose.moderation-test.yaml logs --tail=80 postgres rabbitmq moderation-service
      - name: Remove only isolated test resources
        if: always()
        run: docker compose -p plot-twist-moderation-test -f compose.moderation-test.yaml down -v
