x-log-config: &log-config
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  monitoring-config:
    logging: *log-config
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    command:
      - sh
      - -ec
      - |
        cp /input/prometheus.yml /prometheus-config/prometheus.yml
        rm -rf /grafana-config/provisioning /grafana-config/dashboards
        cp -R /input/grafana/provisioning /input/grafana/dashboards /grafana-config/
        chmod -R a=rX /prometheus-config /grafana-config
    volumes:
      - ./monitoring:/input:ro
      - prometheus-config:/prometheus-config
      - grafana-config:/grafana-config
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 32m
  prometheus:
    logging: *log-config
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/plot-twist-prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    environment:
      GOMEMLIMIT: 190MiB
      GOMAXPROCS: "2"
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["prometheus-data:/prometheus", "prometheus-config:/etc/plot-twist-prometheus:ro"]
    networks: [services, monitoring]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
      api-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      domain-service: {condition: service_healthy}
  grafana:
    logging: *log-config
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-plot-twist-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_PATHS_PROVISIONING: /etc/plot-twist-grafana/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/plot-twist-grafana/dashboards/backend-overview.json
      GF_LOG_MODE: console
      GOMEMLIMIT: 280MiB
      GOMAXPROCS: "2"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "grafana-config:/etc/plot-twist-grafana:ro"]
    networks: [monitoring]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      monitoring-config: {condition: service_completed_successfully}
      prometheus: {condition: service_healthy}
  gateway:
    logging: *log-config
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
  postgres:
    logging: *log-config
    image: postgres:17
    environment:
      POSTGRES_USER: plot_twist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot_twist -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-init:
    logging: *log-config
    build: ./docker/postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
      DOMAIN_DB_PASSWORD: ${DOMAIN_DB_PASSWORD:-domain_dev_password}
    command: ["sh", "/bootstrap/bootstrap.sh"]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  auth-service:
    logging: *log-config
    env_file: ./monitoring/java-metrics.env
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USER: app_auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-demo}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-local-demo-password}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-local-client-secret}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://127.0.0.1:18080/callback}
      AUTH_SESSION_DURATION: ${AUTH_SESSION_DURATION:-4h}
      AUTH_BROWSER_REDIRECT_URI: ${AUTH_BROWSER_REDIRECT_URI:-http://localhost:4200/auth/callback}
      AUTH_BOOTSTRAP_ENABLED: "true"
      AUTH_MACHINE_CLIENT_ENABLED: "true"
      AUTH_AUTO_CREATE_KEY: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    volumes:
      - auth-keys:/app/keys
    networks: [edge, services, data]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api-service:
    logging: *log-config
    env_file: ./monitoring/java-metrics.env
    build:
      context: .
      args:
        MODULE: api-service
    deploy:
      replicas: 2
    environment:
      DOMAIN_BASE_URL: http://domain-service:8080
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    networks: [edge, services, data]
    depends_on:
      postgres:
        condition: service_healthy
      domain-service:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  domain-service:
    logging: *log-config
    env_file: ./monitoring/java-metrics.env
    build:
      context: .
      args:
        MODULE: domain-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/profiles
      DB_USER: app_domain
      DB_PASSWORD: ${DOMAIN_DB_PASSWORD:-domain_dev_password}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: plot-twist-profiles
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GK000000000000000000000000}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
      S3_PATH_STYLE: "true"
    networks: [services, data, storage]
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mailpit:
    logging: *log-config
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [edge]
    mem_limit: 256m
  garage:
    logging: *log-config
    image: plot-twist-garage
    build: ./docker/garage
    volumes: ["garage-data:/var/lib/garage"]
    networks: [storage]
    healthcheck:
      test: ["CMD", "garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
  garage-init:
    logging: *log-config
    image: plot-twist-garage
    pull_policy: never
    command: ["sh", "/init.sh"]
    volumes: ["garage-data:/var/lib/garage"]
    environment:
      S3_BUCKET: plot-twist-profiles
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GK000000000000000000000000}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
    networks: [storage]
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
networks:
  monitoring:
    # A regular bridge publishes the loopback-bound UI ports on the host.
  storage:
    internal: true
  edge:
  services:
    internal: true
  data:
    internal: true
volumes:
  prometheus-config:
  grafana-config:
  prometheus-data:
  grafana-data:
  postgres-data:
  auth-keys:
  garage-data:
