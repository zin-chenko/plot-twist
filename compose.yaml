services:
  gateway:
    build:
      context: ./docker/nginx
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    depends_on:
      api-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plot_twist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot_twist -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-init:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
    command: ["psql", "-h", "postgres", "-U", "plot_twist", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/init.sql"]
    volumes:
      - ./docker/postgres/init.sql:/bootstrap/init.sql:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USER: plot_twist
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-demo}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-local-demo-password}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-local-client-secret}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://127.0.0.1:18080/callback}
    volumes:
      - auth-keys:/app/keys
    networks: [edge, services, data]
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
  api-service:
    build:
      context: .
      args:
        MODULE: api-service
    deploy:
      replicas: 2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/story
      DB_USER: plot_twist
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      DOMAIN_BASE_URL: http://domain-service:8080
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    networks: [edge, services, data]
    depends_on:
      postgres:
        condition: service_healthy
      domain-service:
        condition: service_healthy
    stop_grace_period: 30s
  domain-service:
    build:
      context: .
      args:
        MODULE: domain-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/character
      DB_USER: plot_twist
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plot_twist_local}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    networks: [services, data]
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    stop_grace_period: 30s
networks:
  edge:
  services:
    internal: true
  data:
    internal: true
volumes:
  postgres-data:
  auth-keys:
