spring:
  application:
    name: domain-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/profiles}
    username: ${DB_USER:plot_twist}
    password: ${DB_PASSWORD:plot_twist_local}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus
server:
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
spring.datasource.hikari.maximum-pool-size: 10
spring.datasource.hikari.connection-timeout: 3000
auth:
  issuer: ${AUTH_ISSUER:http://localhost:8080}
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8083/oauth2/jwks}
spring.threads.virtual.enabled: true
spring.jackson.deserialization.fail-on-unknown-properties: true
spring.mvc.problemdetails.enabled: true
logging.structured.format.console: ecs
management.tracing.enabled: ${TRACING_ENABLED:false}
management.tracing.sampling.probability: ${TRACING_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
server.error.include-message: never
server.error.include-binding-errors: never
server.error.include-stacktrace: never
spring.config.import: optional:configtree:/run/secrets/
storage:
  endpoint: ${S3_ENDPOINT:}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:plot-twist-profiles}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  path-style: ${S3_PATH_STYLE:false}
storage.use-environment-proxy: ${S3_USE_ENVIRONMENT_PROXY:false}

recommendations:
  enabled: ${RECOMMENDATIONS_ENABLED:true}
  embedding-url: ${EMBEDDING_URL:http://localhost:8090}
  vector-url: ${QDRANT_URL:http://localhost:6333}
  vector-api-key: ${QDRANT_API_KEY:}

spring.rabbitmq.host: ${RABBITMQ_HOST:localhost}
spring.rabbitmq.port: ${RABBITMQ_PORT:5672}
spring.rabbitmq.username: ${RABBITMQ_USER:plot_twist}
spring.rabbitmq.password: ${RABBITMQ_PASSWORD:plot-twist-rabbit-local}
spring.rabbitmq.virtual-host: /plot-twist
spring.rabbitmq.publisher-confirm-type: correlated
spring.rabbitmq.publisher-returns: true
spring.rabbitmq.template.mandatory: true
spring.rabbitmq.connection-timeout: 3s
spring.rabbitmq.requested-heartbeat: 15s
spring.rabbitmq.listener.simple.prefetch: 4
spring.rabbitmq.listener.simple.default-requeue-rejected: false
spring.rabbitmq.listener.simple.retry.enabled: true
spring.rabbitmq.listener.simple.retry.max-attempts: 3
spring.rabbitmq.listener.simple.retry.initial-interval: 1s
spring.rabbitmq.listener.simple.retry.multiplier: 2
spring.rabbitmq.listener.simple.retry.max-interval: 5s
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler: OFF
logging.level.org.springframework.amqp.rabbit.retry.RejectAndDontRequeueRecoverer: OFF

management.health.rabbit.enabled: false
