# Private Java targets; each API replica remains a separate scrape target.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: api-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [api-service], type: A, port: 8080, refresh_interval: 10s}
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [auth-service], type: A, port: 8080, refresh_interval: 10s}
  - job_name: domain-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [domain-service], type: A, port: 8080, refresh_interval: 10s}
  - job_name: moderation-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [moderation-service], type: A, port: 8080, refresh_interval: 10s}
