# Attach your Prometheus to the same private network; do not publish application actuator paths.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: api-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [api-service], type: A, port: 8080}
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [auth-service], type: A, port: 8080}
  - job_name: domain-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [domain-service], type: A, port: 8080}
