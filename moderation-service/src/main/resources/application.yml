spring.application.name: moderation-service
spring.config.import: optional:configtree:/run/secrets/
spring.threads.virtual.enabled: true
spring.jackson.deserialization.fail-on-unknown-properties: true
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
management.endpoints.web.exposure.include: health,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,rabbit
logging.structured.format.console: ecs
management.metrics.tags.application: moderation-service

spring.rabbitmq.host: ${RABBITMQ_HOST:localhost}
spring.rabbitmq.port: ${RABBITMQ_PORT:5672}
spring.rabbitmq.username: ${RABBITMQ_USER:plot_twist}
spring.rabbitmq.password: ${RABBITMQ_PASSWORD:plot-twist-rabbit-local}
spring.rabbitmq.virtual-host: /plot-twist
spring.rabbitmq.publisher-confirm-type: correlated
spring.rabbitmq.publisher-returns: true
spring.rabbitmq.template.mandatory: true
spring.rabbitmq.connection-timeout: 3s
spring.rabbitmq.requested-heartbeat: 15s
spring.rabbitmq.listener.simple.prefetch: 4
spring.rabbitmq.listener.simple.default-requeue-rejected: false
spring.rabbitmq.listener.simple.retry.enabled: true
spring.rabbitmq.listener.simple.retry.max-attempts: 3
spring.rabbitmq.listener.simple.retry.initial-interval: 1s
spring.rabbitmq.listener.simple.retry.multiplier: 2
spring.rabbitmq.listener.simple.retry.max-interval: 5s
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler: OFF
logging.level.org.springframework.amqp.rabbit.retry.RejectAndDontRequeueRecoverer: OFF
spring.rabbitmq.listener.simple.concurrency: ${MODERATION_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency: ${MODERATION_CONCURRENCY:2}

management.metrics.distribution.percentiles-histogram.moderation.processing: true
