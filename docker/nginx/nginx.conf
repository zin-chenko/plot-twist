worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/trusted-proxy.conf;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format gateway '$remote_addr request_id=$request_id "$request_method $uri $server_protocol" status=$status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'duration=$request_time upstream_duration=$upstream_response_time';
    access_log /dev/stdout gateway;
    resolver 127.0.0.11 valid=5s ipv6=off;
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=50r/s;

    upstream api {
        zone api 64k;
        server api-service:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    upstream auth {
        zone auth 64k;
        server auth-service:8080 resolve;
        keepalive 16;
    }
    limit_req_zone $binary_remote_addr zone=auth_client:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=account_creation:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=account_actions:10m rate=20r/m;

    server {
        listen 8080;
        client_max_body_size 1m;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 30s;
        limit_req_status 429;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        # This gateway is the first trusted HTTP hop: discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $gateway_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        # Do not enable non_idempotent retries: a POST may already have been applied.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        error_page 429 = @rate_limited;
        error_page 413 = @too_large;
        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After 12 always;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429}';
        }
        location @too_large {
            default_type application/problem+json;
            return 413 '{"type":"about:blank","title":"Content Too Large","status":413}';
        }
        location = /openapi.json {
            root /usr/share/nginx/html;
            default_type application/json;
            expires 1h;
        }
        location = /healthz {
            access_log off;
            return 200 'ok\n';
        }
        location = /readyz {
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api/actuator/health/readiness;
        }
        # OAuth URLs may contain authorization codes: do not write them to access logs.
        location ~ ^/auth/v1/(registrations|(email-verifications|password-resets)/requests)$ {
            access_log off;
            client_max_body_size 16k;
            limit_req zone=account_creation burst=3 nodelay;
            proxy_pass http://auth;
        }
        location /auth/v1/ {
            access_log off;
            client_max_body_size 16k;
            limit_req zone=account_actions burst=10 nodelay;
            proxy_pass http://auth;
        }
        location = /api/v1/profile {
            client_max_body_size 16k;
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api;
        }
        location = /api/v1/profile/photo {
            client_max_body_size 5m;
            limit_req zone=per_client burst=10 nodelay;
            proxy_read_timeout 25s;
            proxy_pass http://api;
        }
        location /oauth2/ {
            client_max_body_size 16k;
            access_log off;
            limit_req zone=auth_client burst=20 nodelay;
            proxy_pass http://auth;
        }
        # Chrome DevTools probes are optional resources, never authentication requests.
        location ^~ /.well-known/appspecific/ {
            access_log off;
            return 404;
        }
        location /.well-known/ {
            access_log off;
            limit_req zone=auth_client burst=20 nodelay;
            proxy_pass http://auth;
        }
        location = /userinfo {
            access_log off;
            limit_req zone=auth_client burst=20 nodelay;
            proxy_pass http://auth;
        }
        location = /connect/logout {
            access_log off;
            limit_req zone=auth_client burst=20 nodelay;
            proxy_pass http://auth;
        }
        location = /login {
            client_max_body_size 16k;
            access_log off;
            limit_req zone=auth_client burst=20 nodelay;
            proxy_pass http://auth;
        }
        location = /default-ui.css {
            access_log off;
            proxy_pass http://auth;
        }
        location ~ ^/api/v1/stories(?:/|$) {
            client_max_body_size 128k;
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api;
        }
        location /api/ {
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api;
        }
        location / {
            return 404;
        }
    }
}
