worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format gateway '$remote_addr request_id=$request_id "$request" status=$status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'duration=$request_time upstream_duration=$upstream_response_time';
    access_log /dev/stdout gateway;
    resolver 127.0.0.11 valid=5s ipv6=off;
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=50r/s;

    upstream api {
        zone api 64k;
        server api-service:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;
        client_max_body_size 1m;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        keepalive_timeout 30s;
        limit_req_status 429;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # This gateway is the first trusted HTTP hop: discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        # Do not enable non_idempotent retries: a POST may already have been applied.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        location = /healthz {
            access_log off;
            return 200 'ok\n';
        }
        location = /readyz {
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api/actuator/health/readiness;
        }
        location /api/ {
            limit_req zone=per_client burst=100 nodelay;
            proxy_pass http://api;
        }
        location / {
            return 404;
        }
    }
}
