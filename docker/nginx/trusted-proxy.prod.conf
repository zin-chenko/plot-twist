# Only the fixed private address of the TLS terminator may supply client addresses.
set_real_ip_from 172.30.0.10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# Production gateway is private and reachable through the HTTPS terminator.
map $scheme $gateway_scheme { default https; }
proxy_hide_header X-Backend-Instance;
