spring:
  application:
    name: character-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/character}
    username: ${DB_USER:plot_twist}
    password: ${DB_PASSWORD:plot_twist_local}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
